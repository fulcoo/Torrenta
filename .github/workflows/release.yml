name: Build and Upload Release Assets

on:
  push:
    tags:
      - 'v*' # Trigger when pushing a tag like v1.0.0

permissions:
  contents: write

jobs:
  release:
    name: Build & Upload Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm install
          pip install Pillow

      - name: Build WebUI Project
        run: npm run build

      - name: Package Dist for Alternative WebUI (Zip)
        run: |
          cd dist
          zip -r ../torrenta.zip public

      - name: Build Official fnOS FPK Package
        run: python scripts/build_official_fpk.py

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            torrenta.zip
            release/torrenta.fpk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

